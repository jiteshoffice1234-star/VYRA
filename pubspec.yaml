name: vyra
description: "VYRA — an offline-first personal productivity app: daily journal, habit tracker and notes."
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.6.1
  # Navigation
  go_router: ^14.6.2
  # Local database (SQLite)
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  # Utilities
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  intl: ^0.19.0
  # Notifications & reminders
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
